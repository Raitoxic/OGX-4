services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vyrox
      POSTGRES_USER: vyrox_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyrox_change_me_in_production}
    volumes:
      - vyrox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyrox_user -d vyrox"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://vyrox_user:${POSTGRES_PASSWORD:-vyrox_change_me_in_production}@postgres:5432/vyrox
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_a_64_char_random_secret_before_deploying_vyrox_prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  vyrox_pgdata:
